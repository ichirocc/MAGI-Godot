name: Godot UI Check

# 主 CI（docs/godot-ui-migration.md）。UI は Godot 版のみ（3.549.0 で Compose UI と magiGodot フラグを撤去＝
#   Compose 版の v6-engine-check.yml / release-build.yml は削除）。
# GitHub ホストランナー上で Godot 4.5.1 本体（Linux 版、公式リリース。sha512 固定）を取得し、
#   GDScript 静的確認 → import → headless smoke → JVM ホストテスト → Kotlin 単体テスト（接続層込み）
#   → magi.pck 生成込みの assembleDebug（手動実行では assembleRelease も）を一続きで行う。
# export templates（約1GB）は使わない: PCK は tools/build_pck.gd（PCKPacker）で作る。
# app/build.gradle.kts は -PgodotExecutable が無いと設定段階で落ちるので、gradle 呼び出しには必ず渡す。
# 旧: self-hosted runner（ラベル magi-godot）専用・手動のみ。runner が用意できず一度も走らなかったため
#   ホストランナーへ移し、push/PR でも走らせる。

on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: "生成したAPK（debug / release）をartifactとしてアップロードする"
        type: boolean
        default: true
      build_release:
        description: "debugに加えてGodot版のrelease APK（debug鍵署名の動作確認用）もビルドする"
        type: boolean
        default: true
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godot-ui-check-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1-stable
  GODOT_ZIP_SHA512: 5bccbed65a94b82c7c319fdb15719ee8113a6e503976cc54e16f1c61fe95f3d74e5e40b8449b5bb89ff7f424574c20af01a4f5ef08b389e4dc338b245185b0b9

jobs:
  godot-ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 既定 "tools platform-tools" の旧 tools パッケージは SDK リポジトリから消えており
          # setup 段で exit 1 になる。必要なパッケージは下の sdkmanager ステップで入れる。
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache Gradle distribution
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-9.3.1

      - name: Install Gradle 9.3.1
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q --tries=3 --waitretry=5 -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle.zip" | sha256sum -c -
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"

      - name: Add Gradle to PATH
        run: echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dist
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q --tries=3 --waitretry=5 -O /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          # 公式 SHA512-SUMS.txt の値を固定する（Godot を上げるときは env.GODOT_ZIP_SHA512 も同時に更新）。
          echo "${GODOT_ZIP_SHA512}  /tmp/godot.zip" | sha512sum -c -
          mkdir -p "$HOME/godot-dist"
          unzip -q /tmp/godot.zip -d "$HOME/godot-dist"
          chmod +x "$HOME/godot-dist/Godot_v${GODOT_VERSION}_linux.x86_64"

      - name: Resolve Godot executable
        id: godot
        shell: bash
        run: |
          path="$HOME/godot-dist/Godot_v${GODOT_VERSION}_linux.x86_64"
          test -x "$path" || { echo "::error::Godot executable not found at $path"; exit 1; }
          "$path" --version
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: GDScript構文・シーン参照の静的確認
        shell: bash
        run: bash tools/godot-ui-check.sh

      - name: Godot import（.godot/ キャッシュ生成）
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          "$GODOT_BIN" --headless --path godot --import 2>&1 | tee build/ci-logs/godot-import.log

      - name: Godot headless smoke（10画面の生成と refresh）
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path godot --script res://tools/headless_smoke.gd 2>&1 | tee build/ci-logs/godot-headless-smoke.log

      - name: Kotlin/JVMホストテスト（エンジン層・接続層の純ロジック）
        shell: bash
        run: |
          set -o pipefail
          bash tools/host/hosttest.sh 2>&1 | tee build/ci-logs/hosttest.log

      - name: Kotlin単体テスト（エンジン層＋接続層＋MagiGodotActivity のコンパイル）
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          set -o pipefail
          gradle -PgodotExecutable="$GODOT_BIN" testDebugUnitTest --stacktrace 2>&1 | tee build/ci-logs/testDebugUnitTest-godot.log

      - name: Godot組込みAPKビルド（assembleDebug、magi.pck 生成込み）
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          set -o pipefail
          gradle -PgodotExecutable="$GODOT_BIN" :app:assembleDebug --stacktrace 2>&1 | tee build/ci-logs/assembleDebug-godot.log

      # assemble が通っても「起動できる構成」とは限らない。合流後の Manifest で MagiGodotActivity だけが
      # LAUNCHER であること、APK に magi.pck と Godot のネイティブライブラリが入っていることを必須にする。
      - name: 起動構成の検証（merged manifest / APK 内容）
        shell: bash
        run: |
          manifest=$(ls app/build/intermediates/merged_manifest/debug/*/AndroidManifest.xml | head -1)
          echo "merged manifest: $manifest"
          python3 - "$manifest" <<'PY'
          import sys, xml.etree.ElementTree as ET
          A = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          launchers = []
          for act in root.iter("activity"):
              name = act.get(A + "name")
              for f in act.findall("intent-filter"):
                  cats = [c.get(A + "name") for c in f.findall("category")]
                  if "android.intent.category.LAUNCHER" in cats:
                      launchers.append(name)
          print("LAUNCHER activities:", launchers)
          if launchers != ["com.magi.app.godot.MagiGodotActivity"]:
              print("::error::MagiGodotActivity だけが LAUNCHER であるべき")
              sys.exit(1)
          PY
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" > build/ci-logs/apk-contents.txt
          # 必須エントリ（magi.pck / libgodot_android / libmagi_native / libc++_shared）と .so の非圧縮・16KiB 整列
          python3 tools/check_apk_native_libs.py "$apk"

      # release も debug 鍵署名の動作確認用（app/build.gradle.kts の buildTypes.release）。手動実行時のみ。
      - name: Godot組込みAPKビルド（assembleRelease）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.path }}
        run: |
          set -o pipefail
          gradle -PgodotExecutable="$GODOT_BIN" :app:assembleRelease --stacktrace 2>&1 | tee build/ci-logs/assembleRelease-godot.log

      - name: Upload CI logs (on failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: godot-ui-check-ci-logs
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK (Godot UI)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_apk && hashFiles('**/build/outputs/apk/debug/**/*.apk') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: magi-godot-debug-apk-${{ github.sha }}
          path: "**/build/outputs/apk/debug/**/*.apk"
          retention-days: 14

      - name: Upload release APK (Godot UI)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_apk && inputs.build_release && hashFiles('**/build/outputs/apk/release/**/*.apk') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: magi-godot-release-apk-${{ github.sha }}
          path: "**/build/outputs/apk/release/**/*.apk"
          retention-days: 14
