name: Release Build

# Compose 版（既定ビルド）のリリース APK を生成するワークフロー。
# - v* タグを打つと自動でリリース APK をビルドし、成果物としてアップロードする。
# - 手動実行（workflow_dispatch）では upload_apk=true のときだけアップロードする
#   （ストレージ枠超過の注記を避けるためゲートする）。
# 注意: ここでは署名設定を持たないためデバッグ鍵で署名された動作確認用 APK になる
#       （app/build.gradle.kts の buildTypes.release 参照）。ストア配布する場合は別途リリース
#       signingConfig を追加すること。
# Godot 版（-PmagiGodot=true）のリリース APK は Godot 本体が要るため、ここではなく
# godot-ui-check.yml（self-hosted runner・手動実行）で作る。
on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: "Upload built release APK as an artifact (may hit storage quota)"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 既定 "tools platform-tools" の旧 tools パッケージは SDK リポジトリから消えており
          # setup 段で exit 1 になる（v6-engine-check.yml と同じ対処）。必要なパッケージは下で入れる。
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache Gradle distribution
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-9.3.1

      - name: Install Gradle 9.3.1
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q --tries=3 --waitretry=5 -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          # 取得物を公式 sha256 で検証する（Gradle を上げるときはここも同時に更新する）。
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle.zip" | sha256sum -c -
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"

      - name: Add Gradle to PATH
        run: echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        shell: bash
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build/ci-logs/assembleRelease.log || {
            echo "===== Build error summary ====="
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by" build/ci-logs/assembleRelease.log | head -60
            exit 1
          }

      - name: Upload CI logs (on failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-build-ci-logs
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7

      # アップロードはベストエフォート（枠超過などで赤くしない）。
      # タグビルドでは常に、手動実行では upload_apk=true のときのみアップロードする。
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.upload_apk) && hashFiles('**/build/outputs/apk/release/**/*.apk') != '' }}
        with:
          name: app-release-${{ github.sha }}
          path: "**/build/outputs/apk/release/**/*.apk"
          retention-days: 14
